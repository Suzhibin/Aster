		AA0000000000000000000104 /* Sign Simulator Product */ = {
			isa = PBXShellScriptBuildPhase;
			buildActionMask = 2147483647;
			files = (
			);
			inputPaths = (
			);
			name = "Sign Simulator Product";
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# ☠️ Xcode 27.0 缺陷（2026-10-17 本机实证；Xojo 官方博客 2026-09-15 同记录）：\n#    iphonesimulator 构建产物完全没签名（Mach-O 无 LC_CODE_SIGNATURE，\n#    尽管 showBuildSettings 里 CODE_SIGN_IDENTITY=- 解析正常）。\n#    iOS 27 模拟器 launchd 拒绝拉起未签名进程 ⇒ 报\n#    Simulator device failed to launch / FBSOpenApplicationServiceErrorDomain 3 /\n#    Launchd job spawn failed / LaunchdSimError 163 Security policy issue。\n# ✅ 修法 = CodeSign 之前手动 ad-hoc 签（与 Xojo workaround 同姿势）。\n# 🔴 只碰模拟器：真机/归档有正经签名链，⛔ 绝不能动（否则设备装不上）。\nif [ \"$EFFECTIVE_PLATFORM_NAME\" = \"-iphonesimulator\" ]; then\n    _app=\"$TARGET_BUILD_DIR/$WRAPPER_NAME\"\n    if [ -d \"$_app\" ]; then\n        xattr -cr \"$_app\"\n        /usr/bin/codesign --force --deep --sign - \"$_app\"\n        echo \"note: Xcode 27 simulator signing bug - ad-hoc signed $_app\"\n    fi\nfi";
		};
